<!--
  Static form definitions for Netlify form detection (fightclub pattern).
  This file is served at /__forms.html and lets Netlify's crawler detect forms
  even though the real forms live inside Next.js React components.
-->
<form name="quote" data-netlify="true" netlify-honeypot="bot-field" hidden>
  <input type="hidden" name="form-name" value="quote" />
  <input name="bot-field" />
  <input name="name" />
  <input name="email" />
  <input name="phone" />
  <input name="company" />
  <input name="businessType" />
  <input name="annualRevenue" />
  <input name="employees" />
  <input name="coverageNeeded" />
  <input name="state" />
  <textarea name="message"></textarea>
  <!-- added by josh-desk-3 2026-09-20: rendered on the live /quote page but not
       declared here, so Netlify registered a narrower schema and dropped them on
       every submission. Add-only: do not remove entries from this file. -->
  <input name="crewSize" />
  <input name="operationType" />
</form>

<form name="contact" data-netlify="true" netlify-honeypot="bot-field" hidden>
  <input type="hidden" name="form-name" value="contact" />
  <input name="bot-field" />
  <input name="name" />
  <input name="email" />
  <input name="phone" />
  <textarea name="message"></textarea>
</form>
